<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Radar | Free Signal </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes radar-sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .radar-sweep {
            animation: radar-sweep 2s linear infinite;
            background: conic-gradient(from 0deg, rgba(34, 197, 94, 0.5) 0%, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- Header / Navbar -->
    <nav class="w-full max-w-2xl flex justify-between items-center mb-8 glass-card p-4 rounded-2xl">
        <div class="flex items-center gap-2 font-bold text-green-500 text-xl">
            <i data-lucide="radar" class="w-6 h-6"></i>
            <span>CRASH<span class="text-white">RADAR</span></span>
        </div>
        <div class="flex gap-4 text-sm font-medium text-gray-400">
            <a href="#" class="hover:text-white transition">Scanner</a>
            <a href="#" class="hover:text-white transition">History</a>
            <a href="#" class="hover:text-white transition hidden md:block">FAQ</a>
        </div>
    </nav>

    <!-- Main Scanner Section -->
    <main class="w-full max-w-md flex flex-col items-center gap-8">
        
        <!-- Radar Visualization -->
        <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full border-4 border-green-900/30 flex items-center justify-center overflow-hidden bg-black shadow-[0_0_50px_rgba(34,197,94,0.1)]">
            <!-- Grid Lines -->
            <div class="absolute inset-0 border-b border-white/5 top-1/2"></div>
            <div class="absolute inset-0 border-r border-white/5 left-1/2"></div>
            <div class="absolute inset-0 border rounded-full border-white/5 scale-75"></div>
            <div class="absolute inset-0 border rounded-full border-white/5 scale-50"></div>
            
            <!-- Radar Sweep (Visible only when scanning) -->
            <div id="radarSweep" class="absolute inset-0 radar-sweep hidden"></div>

            <!-- Multiplier Display -->
            <div id="displayArea" class="z-10 text-center">
                <p id="statusText" class="text-xs uppercase tracking-widest text-gray-500 mb-1">Ready to scan</p>
                <h1 id="multiplierResult" class="text-6xl font-black text-white">1.00x</h1>
            </div>
        </div>

        <!-- Action Button -->
        <button id="scanBtn" onclick="startScan()" class="w-full py-4 bg-green-600 hover:bg-green-500 text-black font-bold rounded-xl text-lg transition-all active:scale-95 flex items-center justify-center gap-2">
            <i data-lucide="zap" class="fill-current"></i>
            SCAN NEXT SIGNAL
        </button>

        <!-- Stats Bar -->
        <div class="w-full grid grid-cols-3 gap-2 text-center">
            <div class="glass-card p-3 rounded-xl">
                <p class="text-[10px] text-gray-500 uppercase">Last Point</p>
                <p id="lastPoint" class="font-bold text-white">-</p>
            </div>
            <div class="glass-card p-3 rounded-xl">
                <p class="text-[10px] text-gray-500 uppercase">Average</p>
                <p id="avgPoint" class="font-bold text-white">-</p>
            </div>
            <div class="glass-card p-3 rounded-xl">
                <p class="text-[10px] text-gray-500 uppercase">Highest</p>
                <p id="highPoint" class="font-bold text-white">-</p>
            </div>
        </div>

        <!-- History Section -->
        <div class="w-full">
            <h3 class="text-sm font-semibold mb-4 flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4"></i> Demo Crash History
            </h3>
            <div id="historyGrid" class="grid grid-cols-4 gap-2">
                <!-- History items injected here -->
            </div>
        </div>

        <!-- Disclaimer -->
        <div class="text-[10px] text-gray-600 text-center leading-relaxed mt-4">
            <p><strong>Disclaimer:</strong> This is a simulation for entertainment purposes only. This app does not predict real Aviator or Crash game outcomes and is not affiliated with any gambling platform.</p>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        let history = [];
        const scanBtn = document.getElementById('scanBtn');
        const radarSweep = document.getElementById('radarSweep');
        const multiplierDisplay = document.getElementById('multiplierResult');
        const statusText = document.getElementById('statusText');
        const historyGrid = document.getElementById('historyGrid');

        function startScan() {
            // UI state: Scanning
            scanBtn.disabled = true;
            scanBtn.classList.add('opacity-50', 'cursor-not-allowed');
            radarSweep.classList.remove('hidden');
            statusText.innerText = "Scanning algorithms...";
            multiplierDisplay.innerText = "---";
            multiplierDisplay.classList.add('animate-pulse');

            // Simulate 2.5 second scan
            setTimeout(() => {
                const result = generateCrashPoint();
                finishScan(result);
            }, 2500);
        }

        function generateCrashPoint() {
            // Algorithm to mimic typical crash game distributions
            const rand = Math.random();
            if (rand < 0.1) return (1.00 + Math.random() * 0.2).toFixed(2); // 10% low crash
            if (rand < 0.8) return (1.20 + Math.random() * 2.5).toFixed(2); // 70% mid range
            return (3.70 + Math.random() * 10).toFixed(2); // 20% high multiplier
        }

        function finishScan(val) {
            // Update UI
            radarSweep.classList.add('hidden');
            scanBtn.disabled = false;
            scanBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            multiplierDisplay.innerText = val + "x";
            multiplierDisplay.classList.remove('animate-pulse');
            statusText.innerText = "Signal Found";

            // Add to history
            history.unshift(val);
            if (history.length > 8) history.pop();
            
            updateHistoryUI();
            updateStats();
        }

        function updateHistoryUI() {
            historyGrid.innerHTML = history.map(h => `
                <div class="glass-card py-2 text-center rounded-lg font-bold ${parseFloat(h) > 2 ? 'text-green-400' : 'text-red-400'}">
                    ${h}x
                </div>
            `).join('');
        }

        function updateStats() {
            const last = history[0];
            const high = Math.max(...history.map(Number));
            const avg = (history.reduce((a, b) => a + Number(b), 0) / history.length).toFixed(2);

            document.getElementById('lastPoint').innerText = last + "x";
            document.getElementById('highPoint').innerText = high + "x";
            document.getElementById('avgPoint').innerText = avg + "x";
        }
    </script>
</body>
</html>
